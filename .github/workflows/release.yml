name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish Windows x64
        run: |
          dotnet publish src/WordSprinter/WordSprinter.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true `
            -o publish/win-x64
      - name: Install WiX
        run: dotnet tool install --global wix --version "4.0.5"
      - name: Build MSI
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          wix build packaging/windows/WordSprinter.wxs `
            -d "Version=$version" `
            -o "WordSprinter-${{ github.ref_name }}-win-x64.msi"
      - name: Rename exe
        run: copy publish\win-x64\WordSprinter.exe WordSprinter-${{ github.ref_name }}-win-x64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            WordSprinter-${{ github.ref_name }}-win-x64.exe
            WordSprinter-${{ github.ref_name }}-win-x64.msi

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install create-dmg
        run: brew install create-dmg
      - name: Publish macOS x64
        run: |
          dotnet publish src/WordSprinter/WordSprinter.csproj \
            -c Release -r osx-x64 --self-contained true \
            -p:PublishSingleFile=true \
            -o publish/osx-x64
      - name: Create DMG
        run: bash packaging/macos/create-dmg.sh "${{ github.ref_name }}"
      - name: Rename binary
        run: cp publish/osx-x64/WordSprinter "WordSprinter-${{ github.ref_name }}-macos-x64"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: |
            WordSprinter-${{ github.ref_name }}-macos-x64
            WordSprinter-${{ github.ref_name }}-macos-x64.dmg

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev build-essential rpm flatpak flatpak-builder
          sudo gem install fpm --no-document
      - name: Publish Linux x64
        run: |
          dotnet publish src/WordSprinter/WordSprinter.csproj \
            -c Release -r linux-x64 --self-contained true \
            -p:PublishSingleFile=true \
            -o publish/linux-x64
      - name: Build DEB
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          bash packaging/linux/build-deb.sh "$VERSION"
      - name: Build RPM
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          bash packaging/linux/build-rpm.sh "$VERSION"
      - name: Install Flatpak SDK
        run: |
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.freedesktop.Platform//23.08 org.freedesktop.Sdk//23.08
      - name: Build Flatpak
        run: |
          flatpak-builder --user --repo=repo --force-clean build-dir \
            packaging/linux/com.wordsprinter.WordSprinter.yml
          flatpak build-bundle repo \
            "WordSprinter-${{ github.ref_name }}-linux-x64.flatpak" \
            com.wordsprinter.WordSprinter
      - name: Rename binary
        run: cp publish/linux-x64/WordSprinter "WordSprinter-${{ github.ref_name }}-linux-x64"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            WordSprinter-${{ github.ref_name }}-linux-x64
            wordsprinter_*_amd64.deb
            wordsprinter-*.x86_64.rpm
            WordSprinter-${{ github.ref_name }}-linux-x64.flatpak

  create-release:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          fail_on_unmatched_files: false
